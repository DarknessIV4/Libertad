# The Libertad web proxy. Settings come from a .env file next to this one, for example:
#   LIBERTAD_SERVERS=mumble.example.com=My server
#   LIBERTAD_TRUST_PROXY=1
services:
  libertad:
    build: .
    restart: unless-stopped
    # Host networking, so STUN sees each visitor's real address (through Docker's port
    # forwarding it would often see Docker's own) and a Mumble server on this machine is
    # reachable as localhost. The proxy listens on 127.0.0.1:8080 for nginx, on port 3478 (UDP and
    # TCP) for STUN and the relay, and relays streams on UDP 49160-49659.
    network_mode: host
    # Passed on from .env (or the shell); empty means the proxy's default. Written out one by
    # one because older docker-compose versions cannot mark an env_file as optional.
    environment:
      LIBERTAD_SERVERS: ${LIBERTAD_SERVERS:-}
      LIBERTAD_ALLOW_ANY: ${LIBERTAD_ALLOW_ANY:-}
      LIBERTAD_ALLOW_PRIVATE: ${LIBERTAD_ALLOW_PRIVATE:-}
      LIBERTAD_PORT: ${LIBERTAD_PORT:-8080}
      LIBERTAD_BIND: ${LIBERTAD_BIND:-127.0.0.1}
      LIBERTAD_ORIGINS: ${LIBERTAD_ORIGINS:-}
      LIBERTAD_TRUST_PROXY: ${LIBERTAD_TRUST_PROXY:-}
      LIBERTAD_SEND_PROXY: ${LIBERTAD_SEND_PROXY:-}
      LIBERTAD_STUN_PORT: ${LIBERTAD_STUN_PORT:-3478}
      LIBERTAD_STUN_BIND: ${LIBERTAD_STUN_BIND:-}
      LIBERTAD_TURN: ${LIBERTAD_TURN:-}
      LIBERTAD_TURN_IP: ${LIBERTAD_TURN_IP:-}
      LIBERTAD_TURN_PORTS: ${LIBERTAD_TURN_PORTS:-}
      LIBERTAD_TURN_URLS: ${LIBERTAD_TURN_URLS:-}
      LIBERTAD_DEBUG: ${LIBERTAD_DEBUG:-}
      LIBERTAD_TURN_MAX: ${LIBERTAD_TURN_MAX:-}
      LIBERTAD_TURN_PER_ADDRESS: ${LIBERTAD_TURN_PER_ADDRESS:-}
      LIBERTAD_MAX_CONNECTIONS: ${LIBERTAD_MAX_CONNECTIONS:-}
      LIBERTAD_MAX_PER_ADDRESS: ${LIBERTAD_MAX_PER_ADDRESS:-}
